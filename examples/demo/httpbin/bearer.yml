info:
  name: Auth héritée du dossier
  type: http
  seq: 2

http:
  method: GET
  url: "{{httpbin}}/bearer"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token
      operator: eq
      value: demo-token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
