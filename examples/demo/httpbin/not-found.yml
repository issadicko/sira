info:
  name: Statut 404 attendu
  type: http
  seq: 3

http:
  method: GET
  url: "{{httpbin}}/status/404"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
