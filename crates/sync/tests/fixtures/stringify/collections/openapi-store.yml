    type: apikey
    key: X-Api-Key
    value: "{{apiKey}}"
    placement: header

docs:
  content: |
    # Boutique

    API de démonstration : commandes, produits & clients.
    Voir aussi #docs et `README`.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
