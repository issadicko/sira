info:
  name: Upload photo
  type: http
  seq: 3
  tags:
    - pets

http:
  method: POST
  url: "{{baseUrl}}/pets/:petId/photo"
  params:
    - name: petId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
