info:
  name: Auth apikey-header
  type: http
  seq: 1

http:
  method: GET
  url: https://api.x.test/r
  auth:
    type: apikey
    key: X-Api-Key
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
