info:
  name: Auth oauth2-authorization-code-minimal
  type: http
  seq: 1

http:
  method: GET
  url: https://api.x.test/r
  auth:
    type: oauth2
    flow: authorization_code
    pkce:
      disabled: true
    tokenConfig:
      placement:
        query: access_token
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
