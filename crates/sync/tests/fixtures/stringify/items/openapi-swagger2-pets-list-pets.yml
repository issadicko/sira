info:
  name: List pets
  type: http
  seq: 1
  tags:
    - pets

http:
  method: GET
  url: "{{baseUrl}}/pets"
  params:
    - name: limit
      value: "20"
      type: query
    - name: status
      value: available
      type: query
      disabled: true
    - name: status
      value: sold
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/pets"
      method: GET
      params:
        - name: limit
          value: "20"
          type: query
        - name: status
          value: available
          type: query
          disabled: true
        - name: status
          value: sold
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Rex"
            }
          ]
