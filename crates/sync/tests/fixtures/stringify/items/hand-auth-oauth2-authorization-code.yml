info:
  name: Auth oauth2-authorization-code
  type: http
  seq: 1

http:
  method: GET
  url: https://api.x.test/r
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://auth.test/authorize
    accessTokenUrl: https://auth.test/token
    refreshTokenUrl: https://auth.test/refresh
    callbackUrl: https://app.test/cb
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    additionalParameters:
      authorizationRequest:
        - name: audience
          placement: query
          value: api
        - name: prompt
          placement: header
      accessTokenRequest:
        - name: resource
          placement: body
          value: r
      refreshTokenRequest:
        - name: k
          placement: header
          value: v
    scope: read write
    state: xyz
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: id_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
