info:
  name: Auth oauth2-client-credentials
  type: http
  seq: 1

http:
  method: GET
  url: https://api.x.test/r
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{oauth_token_url}}"
    credentials:
      clientId: id
      clientSecret: secret
      placement: body
    scope: admin
    additionalParameters:
      accessTokenRequest:
        - name: tenant
          placement: query
          value: t1
    tokenConfig:
      placement: {}
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
