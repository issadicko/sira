info:
  name: Auth oauth2-password
  type: http
  seq: 1

http:
  method: GET
  url: https://api.x.test/r
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://auth.test/token
    credentials:
      clientId: cli
    resourceOwner:
      username: "{{user}}"
      password: "{{pass}}"
    tokenConfig:
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
