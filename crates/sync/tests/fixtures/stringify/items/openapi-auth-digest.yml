info:
  name: Digest
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/digest"
  auth:
    type: digest
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/digest"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
