swagger: '2.0'
info:
  title: Swagger fait main
  version: 1.0.0
  description: Cas limites Swagger 2.0
basePath: /api/v1/
consumes: [application/json]
produces: [application/xml, application/json]
securityDefinitions:
  basic: { type: basic }
  key: { type: apiKey, in: query, name: token, description: Jeton }
  headerKey: { type: apiKey, in: header, name: X-Key }
  implicit:
    type: oauth2
    flow: implicit
    authorizationUrl: https://auth.example.com/authorize
    scopes: { read: Lire, write: Écrire }
  password: { type: oauth2, flow: password, tokenUrl: https://auth.example.com/token, scopes: { a: A } }
  application: { type: oauth2, flow: application, tokenUrl: https://auth.example.com/app }
  accessCode:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://auth.example.com/code
    tokenUrl: https://auth.example.com/token
security:
  - key: []
tags:
  - { name: pets, description: Les animaux }
parameters:
  limitParam: { name: limit, in: query, type: integer, default: 20 }
definitions:
  Pet:
    type: object
    required: [name]
    properties:
      id: { type: integer, format: int64 }
      name: { type: string, example: Rex }
      tag: { type: string }
      owner: { $ref: '#/definitions/Owner' }
  Owner:
    type: object
    properties:
      pets: { type: array, items: { $ref: '#/definitions/Pet' } }
responses:
  NotFound: { description: Introuvable, schema: { type: object, properties: { code: { type: integer } } } }
paths:
  /pets:
    parameters:
      - $ref: '#/parameters/limitParam'
    get:
      tags: [pets]
      summary: Lister
      parameters:
        - { name: status, in: query, type: array, items: { type: string, enum: [available, sold] }, collectionFormat: multi }
        - { name: pipes, in: query, type: array, items: { type: string, enum: [a, b] }, collectionFormat: pipes, required: true }
        - { name: csvdef, in: query, type: array, items: { type: string, enum: [a, b] }, default: [b, a] }
        - { name: multidef, in: query, type: array, items: { type: string, enum: [a, b] }, collectionFormat: multi, default: [b] }
        - { name: multiitemdef, in: query, type: array, items: { type: string, enum: [a, b], default: b }, collectionFormat: multi }
        - { name: tsv, in: query, type: array, items: { type: string, enum: [x, y] }, collectionFormat: tsv }
        - { name: sort, in: query, type: string, enum: [asc, desc], default: desc }
        - { name: X-Req, in: header, type: string, required: true }
        - { name: X-Ex, in: header, type: string, example: exemple }
        - { name: filter, in: query, type: object, properties: { a: { type: string }, b: { type: integer, example: 2 } }, required: true }
        - { name: obj, in: query, schema: { type: object, required: [x], example: { x: 1 }, properties: { x: { type: integer }, y: { type: string } } } }
      responses:
        '200':
          description: Liste
          schema: { type: array, items: { $ref: '#/definitions/Pet' } }
          examples:
            application/json: [{ id: 1, name: Rex }]
            application/xml: { pet: { id: 1 } }
            text/plain: une liste
        '404': { $ref: '#/responses/NotFound' }
        default: { description: erreur }
    post:
      tags: [pets]
      summary: Créer
      security: []
      parameters:
        - { name: body, in: body, required: true, schema: { $ref: '#/definitions/Pet' } }
      responses:
        '201': { description: Créé, schema: { $ref: '#/definitions/Pet' } }
        '204': {}
  /pets/{id}:
    parameters:
      - { name: id, in: path, required: true, type: integer }
    put:
      summary: Remplacer (XML)
      consumes: [application/xml]
      security: [{ basic: [] }]
      parameters:
        - { name: body, in: body, schema: { $ref: '#/definitions/Pet' } }
      responses:
        '200': { description: ok }
    patch:
      summary: Formulaire
      consumes: [application/x-www-form-urlencoded]
      security: [{ headerKey: [] }]
      parameters:
        - { name: name, in: formData, type: string, default: Rex }
        - { name: age, in: formData, type: integer, enum: [1, 2] }
        - { name: note, in: formData, type: string, description: Une note }
      responses:
        '200': { description: ok }
    post:
      summary: Fichier
      security: [{ implicit: [write] }]
      parameters:
        - { name: file, in: formData, type: file, description: Le fichier }
        - { name: caption, in: formData, type: string, example: légende }
      responses:
        '200': { description: ok }
    delete:
      summary: Supprimer
      security: [{ password: [] }]
      consumes: [multipart/form-data]
      parameters:
        - { name: reason, in: formData, type: string }
      responses:
        '204': { description: supprimé }
  /oauth:
    get:
      summary: Application
      security: [{ application: [] }]
      responses: { '200': { description: ok } }
    post:
      summary: Code
      security: [{ accessCode: [x, y] }]
      responses: { '200': { description: ok } }
    head:
      summary: Inconnu
      security: [{ unknown: [] }]
      responses: { '200': { description: ok } }
    trace:
      summary: Ignorée en Swagger 2
      responses: { '200': { description: ok } }
  /text:
    post:
      summary: Texte
      consumes: [text/plain]
      produces: []
      parameters:
        - { name: body, in: body, schema: { type: string, example: bonjour } }
      responses:
        '200': { description: ok, schema: { type: string } }
