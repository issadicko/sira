info:
  name: Untitled Request
  type: http

http:
  method: POST
  url: https://api.example.com/graphql
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "{ me { id } }",
        "variables": {
          "a": 1
        }
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
