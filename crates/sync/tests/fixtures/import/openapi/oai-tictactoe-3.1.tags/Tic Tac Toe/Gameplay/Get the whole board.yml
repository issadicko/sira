info:
  name: Get the whole board
  type: http
  seq: 1
  tags:
    - Gameplay

http:
  method: GET
  url: "{{baseUrl}}/board"
  headers:
    - name: api-key
      value: "{{apiKey}}"
      description: API key provided in console
  auth:
    type: apikey
    key: api-key
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/board"
      method: GET
      headers:
        - name: api-key
          value: "{{apiKey}}"
          description: API key provided in console
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "winner": ".",
            "board": [
              [
                "."
              ]
            ]
          }

docs: Retrieves the current state of the board and the winner.
