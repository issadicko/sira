info:
  name: OAuth2 sans flux
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/noflow"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{oauth_token_url}}"
    refreshTokenUrl: "{{oauth_refresh_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: ok
    request:
      url: "{{baseUrl}}/noflow"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
