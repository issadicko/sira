info:
  name: Get museum hours
  type: http
  seq: 1
  tags:
    - Operations

http:
  method: GET
  url: "{{baseUrl}}/museum-hours"
  params:
    - name: startDate
      value: 2023-02-23
      type: query
      description: Starting date to retrieve future operating hours from. Defaults to today's date.
    - name: page
      value: "1"
      type: query
      description: Page number to retrieve.
    - name: limit
      value: "10"
      type: query
      description: Number of days per page.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
