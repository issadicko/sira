info:
  name: Basic
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/basic"
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
