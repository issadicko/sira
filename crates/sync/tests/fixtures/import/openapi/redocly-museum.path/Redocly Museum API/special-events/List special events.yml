info:
  name: List special events
  type: http
  seq: 2
  tags:
    - Events

http:
  method: GET
  url: "{{baseUrl}}/special-events"
  params:
    - name: startDate
      value: 2023-02-23
      type: query
      description: Starting date to retrieve future operating hours from. Defaults to today's date.
    - name: endDate
      value: 2023-04-18
      type: query
      description: End of a date range to retrieve special events for. Defaults to 7 days after `startDate`.
    - name: page
      value: "1"
      type: query
      description: Page number to retrieve.
    - name: limit
      value: "10"
      type: query
      description: Number of days per page.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: List of special events
    request:
      url: "{{baseUrl}}/special-events"
      method: GET
      params:
        - name: startDate
