info:
  name: Create special events
  type: http
  seq: 1
  tags:
    - Events

http:
  method: POST
  url: "{{baseUrl}}/special-events"
  body:
    type: json
    data: |-
      {
        "name": "Mermaid Treasure Identification and Analysis",
        "location": "Under the seaaa 🦀 🎶 🌊.",
        "eventDescription": "Join us as we review and classify a rare collection of 20 thingamabobs, gadgets, gizmos, whoosits, and whatsits, kindly donated by Ariel.",
        "dates": [
          "2023-09-05",
          "2023-09-08"
        ],
        "price": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Special event created
    request:
      url: "{{baseUrl}}/special-events"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Mermaid Treasure Identification and Analysis",
            "location": "Under the seaaa 🦀 🎶 🌊.",
            "eventDescription": "Join us as we review and classify a rare collection of 20 thingamabobs, gadgets, gizmos, whoosits, and whatsits, kindly donated by Ariel.",
            "dates": [
              "2023-09-05",
              "2023-09-08"
            ],
            "price": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "eventId": "dad4bce8-f5cb-4078-a211-995864315e39",
            "name": "Mermaid Treasure Identification and Analysis",
            "location": "Under the seaaa 🦀 🎶 🌊.",
            "eventDescription": "Join us as we review and classify a rare collection of 20 thingamabobs, gadgets, gizmos, whoosits, and whatsits, kindly donated by Ariel.",
            "dates": [
              "2023-09-05",
              "2023-09-08"
            ],
            "price": 30
          }
  - name: 400 Response (Create special event)
    description: Bad request.
    request:
      url: "{{baseUrl}}/special-events"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Mermaid Treasure Identification and Analysis",
