info:
  name: getRepository
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/2.0/repositories/:username/:slug"
  params:
    - name: username
      value: ""
      type: path
    - name: slug
      value: ""
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar('getPullRequestsByRepository_username', res.body.owner/username);
          bru.setVar('getPullRequestsByRepository_slug', res.body.slug);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: The repository
    request:
      url: "{{baseUrl}}/2.0/repositories/:username/:slug"
      method: GET
      params:
        - name: username
          value: ""
          type: path
        - name: slug
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "slug": "",
            "owner": {
              "username": "",
              "uuid": ""
            }
          }
