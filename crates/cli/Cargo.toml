[package]
name = "xc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "xc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
xc-codegen.workspace = true
xc-core.workspace = true
xc-engine.workspace = true
xc-runner.workspace = true
xc-secrets.workspace = true
xc-sync.workspace = true

[features]
default = ["keychain"]
# Le trousseau du système pour les secrets des environnements ; l'image Docker, sans service de trousseau, s'en passe.
keychain = ["xc-secrets/keychain"]

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
