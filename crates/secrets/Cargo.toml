[package]
name = "xc-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

[features]
default = ["keychain"]
# Le trousseau du système (absent d'une image sans service de trousseau, comme celle de Docker).
keychain = ["dep:keyring"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
