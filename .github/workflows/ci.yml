name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Front (Angular)
        working-directory: app
        run: npm ci && npm run build
      - name: Tests du front (Node)
        working-directory: app
        run: npm test
      - name: Toolchain Rust (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Corpus Bruno (Gate 1)
        uses: actions/cache@v4
        with:
          path: target/corpus
          key: corpus-${{ runner.os }}-${{ hashFiles('crates/core/tests/corpus/manifest.json') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image Docker du CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sira:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Le binaire démarre dans l'image
        run: docker run --rm sira:ci --version
      - name: Il lit une collection montée
        run: docker run --rm -v "$PWD/examples/demo:/collection:ro" sira:ci check /collection
