[package]
name = "xc-app"
description = "Client API desktop offline-first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "xc_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
trash = "5"
xc-codegen.workspace = true
xc-core.workspace = true
xc-engine.workspace = true
xc-proto.workspace = true
xc-runner.workspace = true
xc-secrets = { workspace = true, features = ["keychain"] }
xc-sync.workspace = true
xc-watch.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri = { version = "2", features = ["test"] }
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
protox = "0.10"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
