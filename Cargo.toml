[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/sync", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/issadicko/sira"

[workspace.dependencies]
xc-core = { path = "crates/core" }
xc-engine = { path = "crates/engine" }
xc-sync = { path = "crates/sync" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
